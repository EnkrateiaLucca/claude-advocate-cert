# Claude Certified Associate Exam Prep

## A two-hour crash course for the CCAO-F exam: the blueprint, the judgment patterns, and live practice in claude.ai.

.footer[Claude Certified Associate – Foundations (CCAO-F)<span>O'Reilly Live Training · Lucas Soares</span>]

???
Welcome. Two hours, five segments, nine live demos, eleven exam-style questions.

Goal for today: by the end, every attendee can read a CCAO-F item, find the constraint in the stem, name the distractor pattern behind each wrong option, and pick the proportionate answer.

Ask people to open claude.ai in a second window and download the repo so they have `assets/demo-files/` ready. Pro or higher is best because Segment 3 builds a Project.

All demo files are fictional. All practice questions are original. The three official samples come from the public exam guide.

# Four credentials, one program

| Credential | Fee | Built for |
|---|---|---|
| **Associate – Foundations** (today) | $99 | Ops, marketing, PM, education, comms pros who use Claude daily |
| Developer – Foundations | $125 | Engineers building with the API, Claude Code, MCP |
| Architect – Foundations | $125 | Partners designing Claude solutions end to end |
| Architect – Professional | $175 | Advanced architecture expertise |

**Registration currently requires a Claude Partner Network company email.** The skills apply to everyone.

???
Associates escalate complex or technical work to Developers and Architects. The exam tests that you know where your lane ends.

Eligibility: the Partner Academy FAQ says registration needs a partner email on a recognized company domain. Personal email addresses do not work. If you are not at a partner org, today still covers the skills; check https://anthropic-partners.skilljar.com/page/faq-certifications for changes.

The Associate credential does not count toward Partner Network tier eligibility. The other three do.

Discounts follow the partner tier (Select, Preferred, Global Premier get 50% off). Mention only if asked.

# The exam at a glance

| Item | Detail |
|---|---|
| Format | 60 items · multiple-choice + multiple-response ("select N") |
| Time | 120 min · about 2 min per item |
| Pass | Scaled 720 on 100–1,000 · **720 ≠ 72% raw** |
| Delivery | $99 · Pearson VUE, online or test center |
| Rules | Closed book · English only · NDA before you start |
| Validity | 12 months · free on-time renewal |

???
Scoring is criterion-referenced: you are measured against a fixed standard. Other candidates' scores play no part. The cut score came from a standard-setting study with subject-matter experts.

The score report shows percent-correct per domain. Those percentages do not decide pass or fail. Only the total scaled score does.

Anthropic does not publish the raw-to-scaled conversion. Do not plan around "I need 43 right."

Seat time is about 135 minutes with check-in and a short survey. You see your result on screen at the end. Passing candidates get a Credly badge.

Each item states how many responses to select. Treat every multiple-response item as all-or-nothing. No source confirms partial credit.

# The minimally qualified candidate

> "moves beyond basic question-and-answer usage to process reimagination, task automation, and project development."

- Uses Claude daily at work. No coding required.
- Knows Projects, Artifacts, and workflow features.
- Aligns usage with business needs, risk, and policy.
- **Escalates** technical builds to Developers or Architects and high-stakes calls to qualified humans.

???
Quote is from Section 4 of the exam guide.

The MQC sits between casual prompt users and technical AI practitioners. Items are written for this person. When two options look right, ask: what would a careful professional with this profile do?

Out of scope per Section 3: API development, agentic system design, enterprise-scale architecture and integrations. If an option has the Associate building an integration, it is usually wrong. If an option escalates a simple writing task to IT, it is also wrong.

# How items are written

A short workplace scenario, a constraint, and a "most appropriate" action. **The right answer is the proportionate step that lets work continue safely.**

| Distractor pattern | Sounds like |
|---|---|
| Blind trust | "Send it. Claude sounded confident." |
| Fake safeguard | "Tell Claude not to retain the data." |
| Irrelevant fix | "Reword it to sound more formal." |
| Over-reaction | "Skip the analysis entirely." |
| Over-engineering | "Top model for everything." "Escalate it all." |

???
These five labels come straight from the wrong options in the three official samples. Learn them. When you can name the pattern behind a wrong option, you eliminate it in seconds.

The constraint in the stem decides the answer: "compliance team", "high volume", "policy restricts", "every week". Find it before you read the options.

Core exam logic to repeat all session:
1. Verify specifics against the source. Model confidence is not evidence.
2. Match the model and feature to the task.
3. Anonymize before upload.
4. Put recurring context in a Project.
5. Diagnose what changed before rewriting.
6. Escalate technical work to Developers/Architects and high-stakes judgment to qualified humans.

class: question

.q-label[Official sample 1 · D2 Output Evaluation · exam guide, Section 8]

.stem[An associate asks Claude to summarize a new regulation, and Claude produces a confident summary citing a specific subsection number. Before sending the summary to the compliance team, what is the most appropriate action?]

.options[
- **A.** Send it as-is, since Claude expressed high confidence.
- **B.** Verify the cited subsection against the official regulation text before sharing.
- **C.** Ask Claude to rate its own confidence and send it if the rating is high.
- **D.** Reword the summary to sound more formal, then send it.
]

???
DEMO (Lesson 00, "Demo: walk the three official samples"). Read the stem aloud. Ask the room to type their letter in chat before you reveal.

Deciding phrases: "citing a specific subsection" and "compliance team". Specific details are where fabrication concentrates, and the audience raises the stakes.

---

class: answer

.q-label[Official sample 1 · Answer]

.correct[B · Verify the cited subsection against the official regulation text]

| Option | Pattern | Why it fails |
|---|---|---|
| A | Blind trust | Confidence is not evidence |
| C | Fake safeguard | Self-rated confidence is not a reliable accuracy signal |
| D | Irrelevant fix | Formatting does not change correctness |

*Names, dates, numbers, citations, and quotes are where fabrication hides.*

???
Guide rationale, verbatim: "Language models can fabricate specific-looking details such as citation numbers, a hallucination. Validating factual claims, especially citations bound for a compliance audience, against an authoritative source is the diligence step required. Self-reported confidence (A, C) is not a reliable accuracy signal, and reformatting (D) does not address correctness."

We do this exact scenario hands-on in Segment 2, Demo D.

class: question

.q-label[Official sample 2 · D3 Product and Model Selection · exam guide, Section 8]

.stem[An associate needs to generate a high volume of short customer-reply drafts where speed and cost matter more than deep reasoning. Which choice best fits the task?]

.options[
- **A.** Use the most capable, highest-cost model for every reply to maximize quality.
- **B.** Use a faster, lower-cost model suited to straightforward, high-volume tasks.
- **C.** Disable all product features to reduce cost.
- **D.** Switch to a different AI platform.
]

???
Deciding phrase: "speed and cost matter more than deep reasoning". The stem tells you the trade-off. Your job is to honor it.

---

class: answer

.q-label[Official sample 2 · Answer]

.correct[B · A faster, lower-cost model for straightforward, high-volume work]

| Option | Pattern | Why it fails |
|---|---|---|
| A | Over-engineering | Wastes the cost and latency budget |
| C | Irrelevant fix | Features are not the cost driver here |
| D | Irrelevant fix | A new platform does not address the trade-off |

*Match the tier to the task. Save the top tier for complex reasoning.*

???
Guide rationale: "Aligning model selection with task requirements means matching a faster, lower-cost model to straightforward, high-volume work, reserving the most capable model for complex reasoning."

In tier names: this is Haiku territory. The guide never says "always use X". It says match.

.q-label[Official sample 3 · D6 Governance · exam guide, Section 8]

.stem[A project manager wants to upload a spreadsheet containing customer names and account numbers so Claude can analyze trends. Organizational policy restricts sharing regulated personal data. What is the most appropriate action?]

.options[
- **A.** Upload the file as-is, since the analysis is internal.
- **B.** Remove or anonymize the personal identifiers before uploading, consistent with policy.
- **C.** Upload the file but instruct Claude not to retain it.
- **D.** Skip the analysis entirely.
]

???
Deciding phrase: "policy restricts sharing regulated personal data". The policy sets the boundary. The analysis is still worth doing.

class: answer

.q-label[Official sample 3 · Answer]

.correct[B · Remove or anonymize identifiers before uploading]

| Option | Pattern | Why it fails |
|---|---|---|
| A | Blind trust | "Internal" does not override policy |
| C | Fake safeguard | An instruction to Claude is not a policy control |
| D | Over-reaction | Anonymization lets the work continue |

*All three samples reward one move: keep the work going and add the one real control.*

???
Guide rationale: "instructing the model not to retain data (C) does not satisfy the policy control; abandoning the task (D) is unnecessary when anonymization enables it."

Demo G in Segment 4 runs this exact scenario with a fictional customer CSV.

???
Three decisions set the quality ceiling before you write a prompt: the entry point and features, the model tier, and the context. The official prep course "Claude Platform & Model Foundations" adds a fourth: capability features like web search and Research.

---

class: dense

# Feature picker

| You need… | Use | Skip |
|---|---|---|
| A quick current fact | Web search | Research |
| A cited, multi-source report | Research (web search on) | Plain chat |
| Recurring context for one workstream | Project | Re-uploading every chat |
| A deliverable to edit and share | Artifact | A long inline reply |
| A .docx, .xlsx, .pptx, or .pdf | File creation | Copy-paste |
| Multi-step hand-off, a folder, a schedule | Cowork | Chat |
| Thinking out loud, turn by turn | Chat | Cowork |
| A system integration or code | Escalate to Developers | DIY |

???
Research is agentic: many searches, minutes long, cited report. It needs web search enabled. For one fact, web search is faster.

Chat vs Cowork: Chat when you are still working it out and present every turn. Cowork when the deliverable is clear and you describe it once and check back. Cowork saves into a working folder and runs scheduled tasks.

Artifacts: Claude creates one when you ask for something that stands on its own. "Summarize our Q3 results" gets a chat reply. "Turn our Q3 results into a one-page doc for leadership" gets an artifact.

Claude Code exists for software work. For the Associate exam, code and integrations are the escalation signal.

Features combine: a recurring current-information workflow can use a Project, Research, and an Artifact together.

# Model picker: tier and effort

| Tier | Trade-off | Pick it for |
|---|---|---|
| Haiku | Fastest, lowest cost | High-volume, simple: reply drafts, extraction, short summaries |
| Sonnet | Balanced everyday default | Writing, analysis, multi-step work |
| Opus | Deepest reasoning, highest cost | Complex analysis where Sonnet struggled |

**Effort and extended thinking form a second lever.** Raise them for hard reasoning. Lower them for routine work.

???
The exam guide names three tiers. Teach tiers and trade-offs. Version numbers change; the exam does not test them.

One note for accuracy: Anthropic's current lineup also includes Fable, a newer tier above Opus for the largest, longest tasks. The exam guide names three, so answer exam items in Haiku / Sonnet / Opus terms.

Effort controls how thoroughly Claude works before answering. Changing the model changes capability and cost. Changing effort changes cost while keeping the model's capabilities. A frontier model at medium effort often beats an older model at maximum effort.

Cost per task beats cost per token: a stronger model can cost less per task if it needs fewer follow-ups.

Signs of too little effort: missed instructions, unfinished work. Too much: verbosity, scope creep, talking itself out of a correct answer.

Traps: "always use the best model" (Sample 2 A). "Smallest model for hard work." "A bigger model fixes a format, grounding, or policy problem."

class: dense

# Context: restart, summarize, or persist

Every turn re-sends the whole conversation. Long chats cost more and lose focus.

| Situation | Move |
|---|---|
| Chat drifted, early rules ignored | **Restart** with a short handoff summary |
| Same task, near the context limit | **Summarize** (auto-compaction loses some detail) |
| New, unrelated task | **Restart** in a fresh chat |
| Facts needed in every chat | **Persist** in Project instructions, knowledge, or memory |
| Sensitive one-off | **Incognito** (org retention still applies) |

???
Context window: 200K+ tokens, up to 1M on paid plans with supported models. Quality drops before the window fills. Important content buried in the middle of a long input gets less attention, so put key instructions at the start or end.

Usage limits (how much you use over time) differ from length limits (how much fits in one conversation).

Claude does not learn from your corrections. It responds to what is in context. A correction persists only through instructions, knowledge, memory, or a skill.

Memory: on by default for Free/Pro/Max; on Team/Enterprise the owner controls it. Each Project has its own memory space. View and edit under Settings > Memory.

Incognito chats are not saved to history or memory. They still follow org retention policies. Incognito does not make data approved for upload.

# Prompt anatomy

| Part | Example (ops lead) |
|---|---|
| Role | "You are the chief of staff to the ops lead." |
| Context | "Notes from our weekly sync. Budget is frozen until Nov 1." |
| Task | "Extract every action item and open decision." |
| Constraints | "Use only the notes. If an owner isn't named, write Unassigned." |
| Format | "Table: Item, Owner, Due date, Status, Risk." |
| Example | One filled row |

Wrap long material in labeled tags like `<notes>` so instructions and inputs stay separate.

???
Claude 101 teaches a three-part version: set the stage, define the task, specify rules. Same idea.

State the goal along with the format. "Convince my team this timeline is realistic" is a goal. "Three bullet points" is a format.

Explain why a rule exists. Claude generalizes better from a reason than from a bare command.

An example is the strongest signal for format. Concrete limits (word count, bullet count) beat adjectives ("be concise").

Set the terms of the collaboration too: "Push back if my assumptions are wrong." "Tell me what you're uncertain about." Only about 30% of conversations do this, per Anthropic's AI Fluency Index.

---

# Decompose and chain

.two-col[
<div>
<div class="col-head">ONE GIANT PROMPT</div>
"Read these notes, find the actions, draft the email, and fix the problems."
<span style="display:block;margin-top:0.6em">Errors in step 1 spread into everything after.</span>
</div>
<div>
<div class="col-head green">A CHAIN WITH CHECKPOINTS</div>
<strong>1.</strong> Extract actions → <em>you check</em><br>
<strong>2.</strong> Draft the email from the checked table<br>
<strong>3.</strong> Review the draft against stated criteria
<span style="display:block;margin-top:0.6em">Each step yields something you can check.</span>
</div>
]

**Checkpoint line:** "Stop after step 1 and wait for my review."

???
Decomposition is the tested answer for multi-part deliverables, long documents, or shallow output from one big prompt.

Prompt chaining shines when you need to inspect intermediate outputs. The most common chain is self-correction: draft, review against criteria, refine.

For 4–5 dependent steps, a checkpoint counters reasoning drift.

Research mode decomposes on its own. That is part of why it is the right feature for a multi-source report.

---

# Iterate with specific feedback

- **Name the change.** "Cut the first two paragraphs and end with the ask" beats "make it better."
- **Restate the goal** when output follows your words and misses your point.
- **Change one thing per round** so you know what worked.
- **Restart clean** when the chat has drifted.
- **Ask Claude to improve your prompt.** It can interview you.

???
Anthropic's AI Fluency Index: 85.7% of sampled conversations showed iteration. Iterating conversations showed about double the fluency behaviors and were far more likely to question Claude's reasoning.

Trap: repeating an ignored instruction with more force. The course line: "Repeating the instruction with more force won't close the gap." Restate the goal.

Trap: regenerate and hope. A retry with the same prompt does not address the cause.

---

# Strategy by task type

| Task | What changes in the prompt |
|---|---|
| Analysis | Supply the sources, name the criteria, ask for reasoning before the conclusion |
| Research | Use Research mode, set scope and constraints, require checkable sources |
| Drafting | Audience, purpose, tone, length, format, and an example |
| Brainstorming | Ask for volume first, then narrow with criteria |

If you want a recommendation, ask for one. Otherwise you get a balanced discussion.

???
Analysis with no outside information needed: turn on extended thinking or raise effort.

Research prompts: be specific about goals, specify the report sections, include constraints like budget, geography, timeline.

Brainstorming works best in chat, turn by turn. The answer changes what you ask next.

Delegated multi-step work (Cowork): name the deliverable, name the inputs, name the nuances.

class: dense

# Where errors hide

| Failure | Tell |
|---|---|
| Hallucination | Invented specifics: names, dates, statistics, citations, URLs, quotes |
| Inconsistency | Two runs, or two sections, disagree |
| Omission | Every sentence is true and a key exception is missing |
| Distortion | "Up to" becomes "starting at" |
| Bias | Default or stereotyped framing, one-sided claims |
| Sycophancy | Claude agrees with your wrong premise |

*The more precise a claim, the more it needs checking.*

???
Academy line: "Fabrication concentrates in specificity: names, dates, statistics, citations, URLs, quotes."

Training leaves four fingerprints: a pull toward sycophancy, a default toward verbosity, occasional over-caution, and loose calibration between stated confidence and reliability.

Inconsistency across runs signals a claim that is not grounded. Averaging two unverified numbers does not help. Agreement across runs is not proof either.

Polished-output trap: in conversations that produced artifacts, users checked facts and questioned reasoning less often. A clean format earns the same checks as a rough draft.

---

# Fact-check techniques

- **Check specifics** against the source of record.
- **Quote first.** Ask for the exact supporting passage. No quote, no claim.
- **Allow "not in the source."** Give Claude permission to say it doesn't know.
- **Restrict sources** to the attached files when grounding matters.
- **Read the source too.** Omissions only show up there.

> "Self-reported confidence … is not a reliable accuracy signal." · Exam Guide, Sample 1

???
These come from Anthropic's "reduce hallucinations" guidance: allow "I don't know", use direct quotes for grounding, verify with citations and retract unsupported claims, restrict to provided documents.

Signals that are not evidence: Claude's confidence, a self-check ("double-check your work"), agreement across reruns, a citation you haven't opened, a polished format.

Verifying one claim does not validate the rest.

Citations make verification easy. Opening the cited page is the verification.

---

class: dense

# When a human must review

| Trigger | Example | Who reviews |
|---|---|---|
| External audience | Customer reply, press release | You, plus the owner |
| Legal, health, finance | Contract or policy summary | A qualified professional |
| Decisions about people | Hiring, performance, promotion | The accountable manager |
| Regulated workflow | Compliance filing | Qualified reviewer, with a record |
| Low-stakes internal | Brainstorm, own notes | A quick skim |

*Scale review depth to what rides on the output.*

???
Anthropic's Usage Policy lists high-risk use cases (legal, healthcare, insurance, finance, employment and housing, academic testing, media) that require a qualified human in the loop and disclosure.

Academy wording: check the result in proportion to what's riding on it. A quick lookup needs a glance. Analysis that shapes a decision deserves a closer review.

Trap: "add a human somewhere." Review only counts if the reviewer is qualified, sees the evidence, has authority, and acts before the consequential step.

# Output format picker

| Output | Use when |
|---|---|
| Inline | A quick answer you read once |
| Artifact | A deliverable to edit, reuse, or share by link |
| File (.docx, .xlsx, .pptx, .pdf) | Someone needs a downloadable file |

.two-col[
<div>
<div class="col-head">PROMPTING (D1)</div>

.grid-3[
.card[
.tag.c-tag[CLAUDE HANDLES]

.tag.s-tag[CLAUDE ASSISTS, HUMAN DECIDES]

# Augment or redesign?

.two-col[
<div>
<div class="col-head blue">AUGMENT</div>
Same process. Claude speeds up steps inside it.

</div>

- Keep human approval where actions are hard to reverse.

# Where does it go?

| You want… | Put it in |
|---|---|
| Standing tone, role, and rules for one workstream | Project instructions |
| Reference documents | Project knowledge |
| Today-only details | The chat prompt |
| Files or email that change often | A connector |
| A repeatable procedure | A Skill |

| Org-wide rules | Org instructions (admins set these) |

Connectors run on MCP. Web connectors reach cloud services; desktop extensions reach local tools. Test with "Can you access my Drive?"

Skills: folders of instructions and resources Claude loads on demand. Create one by conversation and manage it in Customize. If a Skill "doesn't work," check whether code execution and file creation are on.

# What the exam asks

.objectives[
- Identify, diagnose, and resolve issues with underperforming prompts or poor outputs
- Adjust approach based on feedback and results
- Optimize workflows for efficiency and effectiveness
]

**Diagnose before you rewrite:** What changed? · Context? · Instructions? · Model and effort? · Source?

???
The five-question checklist:
1. What changed? Prompt, files, knowledge, model, settings, inputs.
2. Context: does Claude have the source, the audience, the purpose?
3. Instructions: clear, conflicting, buried in the middle, or drifted?
4. Model and effort: right tier and effort level for the task?
5. Source: is the answer grounded in something checkable?

If you cannot reproduce a problem, get the exact prompt, inputs, and configuration first.

Run-to-run variation is normal. Design the workflow to tolerate it.

---

class: dense

# Symptom → cause → first fix

| Symptom | Likely cause | First fix |
|---|---|---|
| Generic output | Missing context | Add audience, purpose, source, example |
| Wrong format | Format described vaguely | Show a filled example |
| Confident but wrong | No grounding source | Attach or connect the source, then verify |
| Ignores early rules | Long-chat drift | Restart with a summary, move rules to a Project |
| Half the request ignored | Too many asks at once | Decompose |
| Teammates get different results | No shared setup | Shared Project |

**Optimize:** reuse Projects and Skills, right-size model and effort, fix the real bottleneck.

???
Too long or too short: Claude is guessing the length. Give a word or bullet limit.

Confidently wrong math: offload to code execution, then still check the logic and the input data.

If one analyst succeeds and others fail with the same prompt, look for context the first analyst supplies without noticing.

Optimization means lower cost and time at equal quality. Often the slow part is the human steps around Claude. Usage savers: start fresh chats for new tasks, turn off unused connectors, keep project instructions short, lower effort for routine work.

Feedback loop: keep 5–10 test cases for a recurring task and re-run them after each change. Change one variable at a time.

# Exam-day strategy

| Phase | Move |
|---|---|
| Pace | Three passes: every item by 80 min, flagged items by 110, final sweep to 120. |
| Read | Find the constraint: cost, privacy, speed, stakes, policy, audience. |
| Eliminate | Name the distractor pattern and cross it out. |
| Choose | The proportionate step that lets work continue safely. |
| Multiple response | Read "select N" first. Judge each option as true or false. All-or-nothing. |
| Finish | No blanks. Exactly N picks per multiple-response item. Change an answer only with a named reason. |

???
Pass 1 checkpoints: item 15 at about 20 min, 30 at 40, 45 at 60, 60 at 80. Past 2 minutes on an item: pick your best answer, flag it, move on. Behind a checkpoint: speed up on the next few items instead of rushing the last ten.

Tie-breaker: choose the option a careful professional would defend to the risk owner.

The longest, most elaborate option often over-engineers. "Most appropriate" does not mean "most thorough."

Two options usually survive elimination. Pick the one that changes the system over the one that compensates around it.

Closed book: no notes, phones, second monitor, smartwatch, or translation tools. Using AI during the exam is prohibited. Online: stay in webcam view the whole time.

Label every miss: Knowledge (didn't know a fact), Reading (missed the constraint or the "select N"), or Judgment (knew the facts, still picked an over-reaction or a fake safeguard). Knowledge misses need the lesson again. Reading misses need slower stems. Judgment misses need more distractor practice.

Ready to book: at least 2 on every objective, 3 on most of D2, and a practice score that holds steady across two attempts a week apart. Week 4 Thursday: confirm the appointment is more than 48 hours out, the ID name matches, and the system test passes.

# Score yourself on all 30 objectives

| Score | Meaning |
|---|---|
| 0 | I can't explain what this objective means |
| 1 | I can explain it, but I haven't done it in Claude |
| 2 | I've done it in Claude with some guidance |
| 3 | I do it routinely and can say why wrong answers fail |

**Priority = (3 − domain average) × domain weight.** Start with the biggest number.

???
Example from Lesson 08: D2 average 1.5 gives (3 − 1.5) × 21 = 31.5. D7 average 1.0 gives (3 − 1.0) × 10 = 20. D2 comes first even though the D7 score is lower, because D2 carries twice the weight.

The 30 objectives are the verbatim bullets from the domain slides today and the exam guide's Section 6.

# If you remember five things

<ol>
<li><span class="num">1</span><div class="body"><strong>Confidence is not evidence.</strong><span>Check names, numbers, dates, citations, and quotes against the source.</span></div></li>
<li><span class="num">2</span><div class="body"><strong>Match the feature and model to the task.</strong><span>Faster tier for volume. Top tier for hard reasoning. Projects for recurring context.</span></div></li>
<li><span class="num">3</span><div class="body"><strong>Make the task safe, then do it.</strong><span>Anonymize before upload. An instruction to Claude is not a control.</span></div></li>

<li><span class="num">5</span><div class="body"><strong>Pick the proportionate step.</strong><span>Escalate integrations and high-stakes calls. Keep the rest of the work moving.</span></div></li>
